<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIEEN LMS | Librarian Sign In</title>
    <meta name="description"
        content="Indian Railways Institute of Electrical Engineering (IRIEEN) Centralized Library Management System Portal.">

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Feather Icons CDN -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Landing & Login Stylesheet -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
    <div class="landing-page-wrapper">
        <!-- Dark Vignette Overlay -->
        <div class="background-overlay"></div>

        <!-- ==================================================== -->
        <!-- TOP HEADER -->
        <!-- ==================================================== -->
        <header class="landing-header">
            <div class="header-container">
                <div class="institution-branding">
                    <div class="crest-badge">
                        <i data-feather="book-open"></i>
                    </div>
                    <div class="crest-titles">
                        <h1>IRIEEN_Test <span>LMS</span></h1>
                        <!--<p>V2.6 ENTERPRISE</p>-->
                    </div>
                </div>

                <div class="header-right-actions">
                    <!--<div class="header-meta-pill">
                        <span class="dot"></span>
                        <span>System Operational</span>
                    </div>
                    <button class="btn-header-theme" id="btn-header-theme" title="System Status"
                        aria-label="System Theme">
                        <i data-feather="sun"></i>
                    </button>-->
                </div>
            </div>
        </header>

        <!-- ==================================================== -->
        <!-- MAIN CONTENT AREA (CENTERED LOGIN BOX ONLY) -->
        <!-- ==================================================== -->
        <main class="landing-main-content">
            <div class="landing-centered-container">
                <!-- Centered Glassmorphic Login Card -->
                <section class="login-card-wrapper">
                    <div class="login-card">
                        <div class="card-header-block">
                            <div class="login-lock-icon">
                                <i data-feather="lock"></i>
                            </div>
                            <h2>Librarian Sign In</h2>
                            <p class="auth-note">Enter your library staff credentials to access the system</p>
                        </div>

                        <!-- Error Alert Message -->
                        <div class="login-error-alert" id="login-error-alert" role="alert" aria-live="polite">
                            <i data-feather="alert-circle"></i>
                            <span id="login-error-message">Invalid username or password.</span>
                        </div>

                        <!-- Login Form -->
                        <form class="login-form" id="login-form" autocomplete="on">
                            <div class="form-field-group">
                                <label class="field-label" for="username">Username or ID</label>
                                <div class="input-container">
                                    <i data-feather="user" class="input-leading-icon"></i>
                                    <input type="text" id="username" name="username" class="login-input"
                                        placeholder="test_1" autocomplete="username" value="test_1" required autofocus>
                                </div>
                            </div>

                            <div class="form-field-group">
                                <div class="field-label-row">
                                    <label class="field-label" for="password">Password</label>
                                    <span class="default-cred-hint">Default: 123456</span>
                                </div>
                                <div class="input-container password-container">
                                    <i data-feather="lock" class="input-leading-icon"></i>
                                    <input type="password" id="password" name="password" class="login-input"
                                        placeholder="••••••" autocomplete="current-password" value="123456" required>
                                    <button type="button" class="btn-toggle-password" id="btn-toggle-password"
                                        aria-label="Show or hide password" title="Show or hide password">
                                        <i data-feather="eye" class="eye-icon"></i>
                                        <i data-feather="eye-off" class="eye-off-icon" style="display: none;"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-options-row">
                                <label class="checkbox-container">
                                    <input type="checkbox" id="remember-me" checked>
                                    <span class="custom-checkmark"></span>
                                    <span class="checkbox-label">Keep me signed in</span>
                                </label>
                            </div>

                            <button type="submit" class="btn-login" id="btn-submit-login">
                                <span class="btn-text">Access Management System</span>
                                <i data-feather="arrow-right"></i>
                            </button>

                            <!-- Pre-configured Credentials Chip -->
                            <div class="demo-chip-badge">
                                <div class="demo-chip-text">
                                    <i data-feather="key"></i>
                                    <span>Demo: <strong>test_1</strong> &bull; <strong>123456</strong></span>
                                </div>
                                <button type="button" class="btn-autofill-sm" id="btn-autofill"
                                    title="Automatically populate login fields">
                                    <i data-feather="zap"></i> Auto Fill
                                </button>
                            </div>

                            <!--   <div class="security-badge">
                                <i data-feather="shield"></i>
                                <span>Enterprise TLS 1.3 Encryption Active</span>
                            </div> -->
                        </form>
                    </div>
                </section>
            </div>
        </main>

        <!-- ==================================================== -->
        <!-- BOTTOM FOOTER -->
        <!-- ==================================================== -->
        <footer class="landing-footer">
            <div class="footer-content">
                <span>&copy; 2026 / IRIEEN Library Management System. All rights reserved.</span>
            </div>
        </footer>
    </div>

    <!-- Controller Script -->
    <script src="/static/js/login.js"></script>
</body>

</html>
